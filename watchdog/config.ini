# KMBC OBS Watchdog - WM_NULL
# Paste your existing Power Automate / Teams HTTP endpoint here.
TeamsUrl=https://PASTE-YOUR-POWER-AUTOMATE-ENDPOINT-HERE

CheckIntervalSeconds=10
ResponseTimeoutMilliseconds=3000
RequiredFailedChecks=2
AlertCooldownSeconds=300

# Keep 0 while testing. Change to 1 later if you want automatic OBS restart.
AutoRestartOBS=0
RestartDelaySeconds=5

OBSExe=C:\Program Files\obs-studio\bin\64bit\obs64.exe
